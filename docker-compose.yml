services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pushservice
      POSTGRES_PASSWORD: pushservice
      POSTGRES_DB: pushservice
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pushservice"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./apps/api
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env

  worker:
    build: ./apps/worker
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env

  dashboard:
    build: ./dashboard
    ports:
      - "3001:3000"
    depends_on:
      - api

volumes:
  pgdata:
